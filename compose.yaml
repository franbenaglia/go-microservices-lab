# Go Microservices Lab — plataforma local.
#
# Fase 1: PostgreSQL + Inventory + Orders.
# Fase 2: Consul (registro, descubrimiento y health checks).
# Fase 3: balanceo del lado cliente (INVENTORY_BALANCER, --scale inventory=N).
# Fase 4: resiliencia (BREAKER_*, RETRY_*) e inyección de fallos (LAB_MODE).
# Las credenciales se leen de .env (ver .env.example).
#
# Nota: los puertos HTTP de los servicios se publican en 127.0.0.1 de forma
# temporal para poder probarlos; desaparecen cuando llegue Traefik (Fase 7).
# Inventory usa un puerto efímero para poder escalarlo (--scale inventory=N).

name: go-microservices-lab

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 15s
  networks: [lab]

# Variables comunes de registro en Consul.
x-consul-env: &consul-env
  # Modo laboratorio: inyección de fallos y endpoints /admin y /lab.
  LAB_MODE: ${LAB_MODE:-true}
  APP_CONSUL_ADDR: consul:8500
  APP_CONSUL_HEALTH_INTERVAL: 5s
  APP_CONSUL_DEREGISTER_AFTER: 1m

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?definir INVENTORY_DB_PASSWORD en .env}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?definir ORDERS_DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deployments/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lab]

  consul:
    image: hashicorp/consul:2.0.4
    restart: unless-stopped
    command: ["agent"]
    volumes:
      - consuldata:/consul/data
      - ./deployments/consul/server.hcl:/consul/config/server.hcl:ro
    ports:
      - "127.0.0.1:8500:8500" # UI y API de Consul
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8500/v1/status/leader | grep -q ':'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lab]

  inventory:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    image: go-microservices-lab/inventory:dev
    environment:
      <<: *consul-env
      APP_DB_DSN: postgres://inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/inventory?sslmode=disable
      APP_LOG_LEVEL: info
      # Peso opcional para wrr (1..1000; 100 si no se define).
      INSTANCE_WEIGHT: ${INVENTORY_WEIGHT:-}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    # Sin puerto fijo para poder escalar: cada réplica publica su HTTP en un
    # puerto efímero de 127.0.0.1 (`docker compose port --index N inventory 8000`).
    # Temporal hasta que Traefik sea el punto de entrada (Fase 7).
    ports:
      - "127.0.0.1::8000"

  orders:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    image: go-microservices-lab/orders:dev
    environment:
      <<: *consul-env
      APP_DB_DSN: postgres://orders:${ORDERS_DB_PASSWORD}@postgres:5432/orders?sslmode=disable
      # Nombre lógico: el cliente gRPC resuelve las instancias a través de Consul.
      APP_INVENTORY_ENDPOINT: discovery:///inventory-service
      # Selector de balanceo del lado cliente: wrr | p2c | random.
      APP_INVENTORY_BALANCER: ${INVENTORY_BALANCER:-wrr}
      # Resiliencia del cliente hacia Inventory (ver services/orders/configs/config.yaml).
      APP_BREAKER_ENABLED: ${BREAKER_ENABLED:-true}
      APP_BREAKER_KIND: ${BREAKER_KIND:-classic}
      APP_RETRY_ENABLED: ${RETRY_ENABLED:-true}
      APP_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8000" # temporal (Fase 1)

volumes:
  pgdata:
  consuldata:

networks:
  lab:
