# Configuración de arranque de Inventory. Los placeholders ${CLAVE:default} se
# resuelven con variables de entorno APP_<CLAVE> (p. ej. APP_DB_DSN).
# Las credenciales nunca se escriben aquí.
server:
  http:
    addr: "${HTTP_ADDR:0.0.0.0:8000}"
    timeout: "${HTTP_TIMEOUT:5s}"
  grpc:
    addr: "${GRPC_ADDR:0.0.0.0:9000}"
    timeout: "${GRPC_TIMEOUT:5s}"
data:
  dsn: "${DB_DSN:}"
  max_conns: 10
  auto_migrate: "${DB_AUTO_MIGRATE:true}"
log:
  level: "${LOG_LEVEL:info}"
consul:
  # Vacío desactiva el registro (útil para ejecutar el servicio sin Consul).
  address: "${CONSUL_ADDR:}"
  health_interval: "${CONSUL_HEALTH_INTERVAL:5s}"
  deregister_after: "${CONSUL_DEREGISTER_AFTER:1m}"
  # Rutas del API Gateway (Traefik, provider consulCatalog). Traefik balancea
  # por HTTP entre las réplicas sanas (balanceo externo, distinto del de Kratos).
  tags:
    - "traefik.enable=true"
    - "traefik.http.routers.inventory-api.rule=PathPrefix(`/api/products`) || PathPrefix(`/api/inventory`)"
    - "traefik.http.routers.inventory-api.entrypoints=web"
    - "traefik.http.routers.inventory-api.middlewares=api-headers@file"
    # Administración (/admin/inventory/config → /admin/config): solo red local.
    - "traefik.http.routers.inventory-admin.rule=PathPrefix(`/admin/inventory/`)"
    - "traefik.http.routers.inventory-admin.entrypoints=web"
    - "traefik.http.routers.inventory-admin.middlewares=local-only@file,inventory-admin-path,api-headers@file"
    - "traefik.http.middlewares.inventory-admin-path.replacepathregex.regex=^/admin/inventory/(.*)"
    - "traefik.http.middlewares.inventory-admin-path.replacepathregex.replacement=/admin/$1"
telemetry:
  # Endpoint OTLP/gRPC del OpenTelemetry Collector. Vacío desactiva la exportación.
  endpoint: "${OTEL_ENDPOINT:}"
  sample_ratio: "${OTEL_SAMPLE_RATIO:1.0}"   # laboratorio: se muestrean todas las trazas
  metric_interval: "${OTEL_METRIC_INTERVAL:5s}"
