# Generación de código. Los plugins se ejecutan con `go tool` (versiones fijadas en go.mod).
version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: api/gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: api/gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-http"]
    out: api/gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-errors"]
    out: api/gen/go
    opt: paths=source_relative
inputs:
  - directory: api/proto
