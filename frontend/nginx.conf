# Servidor estático del frontend (detrás de Traefik). Las rutas son por hash,
# así que no hace falta reescritura de SPA más allá de index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Recursos con hash en el nombre: cacheables a largo plazo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
